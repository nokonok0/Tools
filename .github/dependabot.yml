version: 2
updates:
  # pyproject.tomlとuv.lockを一緒に更新する。自動マージは行わない。
  - package-ecosystem: uv
    directory: /CodexMeter
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
