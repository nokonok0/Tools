[project]
name = "codex-auto"
version = "0.2.0"
description = "Ollayaで送信ごとにCodex CLIのモデルを自動選択するツール"
requires-python = ">=3.11"
dependencies = ["websockets>=15,<16"]

[project.scripts]
codex-auto = "codex_auto.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_auto"]
