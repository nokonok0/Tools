[project]
name = "codex-auto"
version = "0.1.0"
description = "Select a Codex CLI model with a local Ollaya decision model"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codex-auto = "codex_auto.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_auto"]
